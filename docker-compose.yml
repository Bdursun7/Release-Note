services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipbrief
      POSTGRES_PASSWORD: shipbrief
      POSTGRES_DB: shipbrief
    ports:
      - "5433:5432"
    volumes:
      - shipbrief_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipbrief"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shipbrief_pg:
