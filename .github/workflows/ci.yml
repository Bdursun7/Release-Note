name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://shipbrief:shipbrief@localhost:5432/shipbrief?schema=public
      NEXTAUTH_SECRET: ci-secret-not-for-production-use-32ch
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
